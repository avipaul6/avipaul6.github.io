<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title | default: site.title }}</title>
  <meta name="author" content="Avi Paul" />
  <meta name="description" content="{{ page.description | default: site.description }}" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta property="og:description" content="{{ page.description | default: site.description }}" />
  <meta property="og:url" content="https://avipaul.dev{{ page.url }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- TODO: add og-image.png (1200x630) to the repo root for rich link previews. -->

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314130f'/%3E%3Ctext x='16' y='22' font-size='17' font-family='Georgia,serif' font-weight='700' fill='%23f4f2ee' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />

  <!-- Web fonts: fast (preconnect + swap), not the user's local fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f4f2ee;          /* warm paper */
      --text: #14130f;        /* near-black ink */
      --muted: #78736a;       /* soft grey-brown */
      --faint: #a8a298;
      --line: #dcd7cd;        /* hairline rule */
      --live: #3f7d5a;        /* muted green */
      --display: "Space Grotesk", "Inter", system-ui, sans-serif;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #100f0d; --text: #ecebe6; --muted: #928d84; --faint: #66625b;
        --line: #2b2926; --live: #63b98c;
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--sans); font-size: 17px; line-height: 1.6;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 32px; }

    /* label / eyebrow */
    .label {
      font-size: .74rem; font-weight: 500; letter-spacing: .13em;
      text-transform: uppercase; color: var(--muted);
    }
    .label-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 34px; }

    /* Top bar */
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 30px 0; }
    .brand { font-family: var(--display); font-weight: 700; font-size: 1.15rem; letter-spacing: -.01em; }
    .navlinks { display: flex; gap: 30px; }
    .navlinks a { font-size: .9rem; color: var(--muted); transition: color .15s; }
    .navlinks a:hover { color: var(--text); }

    /* Hero */
    .hero { padding: 60px 0 44px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 30px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); }
    h1 {
      font-family: var(--display); font-weight: 700;
      font-size: clamp(2.7rem, 7vw, 5.4rem); line-height: 1.01;
      letter-spacing: -.035em; margin: 0 0 34px; max-width: 15ch;
    }
    h1 em { font-style: normal; color: var(--muted); }
    .lede { font-size: 1.2rem; line-height: 1.55; color: var(--muted); max-width: 46ch; margin: 0 0 38px; }
    .lede strong { color: var(--text); font-weight: 500; }
    .cta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 26px; }
    .btn-pill {
      display: inline-block; background: var(--text); color: var(--bg);
      font-size: .92rem; font-weight: 500; padding: 13px 26px; border-radius: 100px;
      transition: opacity .15s;
    }
    .btn-pill:hover { opacity: .82; }
    .link-arrow { font-size: .95rem; font-weight: 500; border-bottom: 1px solid var(--line); padding-bottom: 3px; transition: border-color .15s; }
    .link-arrow:hover { border-color: var(--text); }

    /* Sections */
    section { padding: 76px 0; border-top: 1px solid var(--line); }

    /* Work as an editorial list */
    .work-list { list-style: none; margin: 0; padding: 0; }
    .work-item { border-bottom: 1px solid var(--line); }
    .work-item:first-child { border-top: 1px solid var(--line); }
    .work-item a {
      display: flex; align-items: baseline; justify-content: space-between; gap: 24px;
      padding: 30px 0; transition: padding-left .2s ease;
    }
    .work-item a:hover { padding-left: 12px; }
    .work-main { display: flex; flex-direction: column; gap: 8px; }
    .work-name { font-family: var(--display); font-weight: 500; font-size: clamp(1.9rem, 4vw, 3rem); letter-spacing: -.02em; line-height: 1; margin: 0; }
    .work-desc { color: var(--muted); font-size: 1.02rem; max-width: 52ch; margin: 0; }
    .work-meta { display: flex; align-items: center; gap: 16px; white-space: nowrap; flex-shrink: 0; }
    .tag { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .tag.live { color: var(--live); display: inline-flex; align-items: center; gap: 7px; }
    .tag.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
    .work-arrow { font-size: 1.3rem; color: var(--faint); transition: transform .2s ease, color .2s; }
    .work-item a:hover .work-arrow { transform: translate(3px, -3px); color: var(--text); }

    /* Approach — numbered columns */
    .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 8px; }
    .col .num { font-family: var(--display); font-size: 1rem; color: var(--faint); display: block; margin-bottom: 16px; }
    .col h4 { font-size: 1.1rem; font-weight: 600; margin: 0 0 10px; letter-spacing: -.01em; }
    .col p { color: var(--muted); font-size: .98rem; margin: 0; line-height: 1.55; }

    /* Contact */
    .contact-statement { font-family: var(--display); font-weight: 500; font-size: clamp(1.7rem, 4vw, 2.6rem); letter-spacing: -.02em; line-height: 1.1; margin: 0 0 30px; max-width: 18ch; }

    /* Writing index */
    .post-list { list-style: none; padding: 0; margin: 8px 0 0; }
    .post-list li { border-bottom: 1px solid var(--line); }
    .post-list li:first-child { border-top: 1px solid var(--line); }
    .post-list a { display: flex; align-items: baseline; gap: 28px; padding: 26px 0; transition: padding-left .2s ease; }
    .post-list a:hover { padding-left: 12px; }
    .post-date { font-size: .82rem; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); min-width: 82px; }
    .post-list .post-title { font-family: var(--display); font-weight: 500; font-size: clamp(1.2rem, 2.6vw, 1.7rem); letter-spacing: -.015em; line-height: 1.15; }

    /* Essay */
    .essay { max-width: 660px; margin: 0 auto; padding: 20px 0 40px; }
    .back { font-size: .88rem; color: var(--muted); }
    .back:hover { color: var(--text); }
    .essay-title { font-family: var(--display); font-weight: 700; font-size: clamp(1.9rem, 4.5vw, 2.7rem); letter-spacing: -.025em; line-height: 1.08; margin: 22px 0 10px; }
    .essay-date { font-size: .82rem; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 40px; }
    .essay p { margin: 0 0 24px; font-size: 1.13rem; line-height: 1.7; }
    .essay h2 { font-family: var(--display); margin: 40px 0 14px; font-size: 1.4rem; letter-spacing: -.01em; }
    .essay a { border-bottom: 1px solid var(--line); }
    .essay a:hover { border-color: var(--text); }
    .essay blockquote { border-left: 2px solid var(--text); margin: 0 0 24px; padding-left: 22px; color: var(--muted); font-style: italic; }
    .essay-foot { margin-top: 48px; padding-top: 22px; border-top: 1px solid var(--line); font-size: .92rem; color: var(--muted); }

    /* Footer */
    footer { border-top: 1px solid var(--line); padding: 76px 0 70px; }
    .foot-grid { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 28px; }
    .foot-links { display: flex; flex-wrap: wrap; gap: 26px; }
    .foot-links a { font-size: .92rem; color: var(--muted); transition: color .15s; }
    .foot-links a:hover { color: var(--text); }
    .copyright { font-size: .84rem; color: var(--faint); }

    @media (max-width: 720px) {
      .wrap { padding: 0 22px; }
      .cols { grid-template-columns: 1fr; gap: 30px; }
      .work-item a { flex-direction: column; gap: 14px; }
      .work-meta { order: -1; }
      .navlinks { gap: 18px; }
      .navlinks .hide-sm { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <nav class="topbar">
      <a class="brand" href="/">Avi Paul</a>
      <div class="navlinks">
        <a href="/#work">Work</a>
        <a href="/writing/">Writing</a>
        <a href="https://github.com/avipaul6" target="_blank" rel="noopener" class="hide-sm">GitHub</a>
        <a href="/#contact">Contact</a>
      </div>
    </nav>

    {{ content }}

    <footer id="contact">
      <div class="foot-grid">
        <div>
          <div class="contact-statement">Open to interesting problems.</div>
          <div class="copyright">Reach me at <b>me [at] avipaul.dev</b></div>
        </div>
        <div class="foot-links">
          <a href="https://github.com/avipaul6" target="_blank" rel="noopener">GitHub</a>
          <a href="https://www.linkedin.com/in/avijitpaul/" target="_blank" rel="noopener">LinkedIn</a>
          <a href="mailto:me@avipaul.dev">Email</a>
        </div>
      </div>
    </footer>

  </div>
</body>
</html>
