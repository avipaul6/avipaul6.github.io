<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title | default: site.title }}</title>
  <meta name="author" content="Avi Paul" />
  <meta name="description" content="{{ page.description | default: site.description }}" />

  <!-- Open Graph / Twitter. TODO: add og-image.png (1200x630) to the repo root for rich link previews. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta property="og:description" content="{{ page.description | default: site.description }}" />
  <meta property="og:url" content="https://avipaul.dev{{ page.url }}" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='18' font-family='system-ui,sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />

  <style>
    :root {
      --bg: #fafaf9; --surface: #ffffff; --text: #18181b; --muted: #6b7280;
      --border: #e7e5e4; --accent: #4f46e5; --accent-weak: #eef2ff;
      --live: #047857; --live-weak: #ecfdf5;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d10; --surface: #161619; --text: #ededf0; --muted: #9ca3af;
        --border: #26262b; --accent: #818cf8; --accent-weak: #1e1b34;
        --live: #34d399; --live-weak: #0e2b22;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }

    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 0; }
    .brand { font-weight: 700; letter-spacing: -.01em; color: var(--text); font-size: 1.05rem; }
    .brand:hover { text-decoration: none; }
    .navlinks { display: flex; gap: 20px; font-size: .92rem; }
    .navlinks a { color: var(--muted); }
    .navlinks a:hover { color: var(--text); text-decoration: none; }

    .hero { padding: 48px 0 20px; }
    .eyebrow { font-family: var(--mono); font-size: .78rem; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; margin-bottom: 18px; display: inline-flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 4px var(--live-weak); }
    h1 { font-size: clamp(2rem, 5.5vw, 3rem); line-height: 1.08; letter-spacing: -.03em; margin: 0 0 20px; font-weight: 800; }
    h1 .accent { color: var(--accent); }
    .lede { font-size: 1.12rem; color: var(--muted); max-width: 640px; margin: 0 0 28px; }
    .lede strong { color: var(--text); font-weight: 600; }
    .cta-row { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; font-size: .95rem; font-weight: 600; padding: 11px 18px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; }
    .btn:hover { text-decoration: none; }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { filter: brightness(1.07); }
    .btn-ghost { background: var(--surface); color: var(--text); }
    .btn-ghost:hover { border-color: var(--muted); }

    section { padding: 44px 0; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; gap: 16px; }
    .section-head h2 { font-size: 1.35rem; letter-spacing: -.02em; margin: 0; }
    .section-head .aside { font-size: .9rem; color: var(--muted); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; transition: transform .15s ease, border-color .15s ease; }
    .card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .card.feature { grid-column: 1 / -1; }
    .card-title { font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; margin: 0 0 8px; color: var(--text); }
    .card.feature .card-title { font-size: 1.4rem; }
    .card p { margin: 0 0 16px; color: var(--muted); font-size: .96rem; }
    .card.feature p { max-width: 640px; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
    .chip { font-family: var(--mono); font-size: .72rem; letter-spacing: .02em; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .chip.live { color: var(--live); background: var(--live-weak); border-color: transparent; }
    .card-links { margin-top: auto; display: flex; flex-wrap: wrap; gap: 16px; font-size: .9rem; font-weight: 600; }
    .card-links a { display: inline-flex; align-items: center; gap: 5px; }
    .arr { transition: transform .15s ease; }
    .card-links a:hover .arr { transform: translateX(2px); }

    .approach { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
    .approach .quote { font-size: 1.15rem; font-weight: 600; letter-spacing: -.01em; margin: 0 0 18px; }
    .principles { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .principles li { color: var(--muted); font-size: .96rem; padding-left: 26px; position: relative; }
    .principles li::before { content: "→"; position: absolute; left: 0; color: var(--accent); font-weight: 700; }
    .principles b { color: var(--text); font-weight: 600; }

    /* Writing index */
    .post-list { list-style: none; padding: 0; margin: 16px 0 0; }
    .post-list li { display: flex; gap: 16px; align-items: baseline; padding: 15px 0; border-bottom: 1px solid var(--border); }
    .post-date { font-family: var(--mono); font-size: .8rem; color: var(--muted); min-width: 70px; }
    .post-list a { font-size: 1.06rem; font-weight: 600; color: var(--text); }
    .post-list a:hover { color: var(--accent); text-decoration: none; }

    /* Essay */
    .essay { max-width: 680px; padding: 40px 0; }
    .back { font-size: .9rem; color: var(--muted); }
    .back:hover { color: var(--text); text-decoration: none; }
    .essay-title { font-size: clamp(1.6rem, 4vw, 2.1rem); letter-spacing: -.02em; margin: 18px 0 6px; line-height: 1.15; }
    .essay-date { font-family: var(--mono); font-size: .8rem; color: var(--muted); margin-bottom: 30px; }
    .essay p { margin: 0 0 20px; font-size: 1.07rem; }
    .essay h2 { margin: 34px 0 12px; font-size: 1.3rem; letter-spacing: -.01em; }
    .essay a { font-weight: 600; }
    .essay blockquote { border-left: 3px solid var(--accent); margin: 0 0 20px; padding: 2px 0 2px 18px; color: var(--muted); }
    .essay-foot { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); font-size: .92rem; color: var(--muted); }

    footer { border-top: 1px solid var(--border); padding: 40px 0 60px; margin-top: 20px; }
    .foot-grid { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 20px; align-items: center; }
    .foot-links { display: flex; flex-wrap: wrap; gap: 18px; font-size: .95rem; }
    .foot-links a { color: var(--muted); }
    .foot-links a:hover { color: var(--text); text-decoration: none; }
    .copyright { font-size: .85rem; color: var(--muted); }

    @media (max-width: 560px) {
      .navlinks { gap: 14px; }
      .hero { padding-top: 32px; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <nav class="topbar">
      <a class="brand" href="/">Avi Paul</a>
      <div class="navlinks">
        <a href="/#work">Work</a>
        <a href="/writing/">Writing</a>
        <a href="https://github.com/avipaul6" target="_blank" rel="noopener">GitHub</a>
        <a href="/#contact">Contact</a>
      </div>
    </nav>

    {{ content }}

    <footer id="contact">
      <div class="foot-grid">
        <div>
          <div style="font-weight:700; margin-bottom:6px;">Open to interesting problems.</div>
          <div class="copyright">Reach me at <b>me [at] avipaul.dev</b></div>
        </div>
        <div class="foot-links">
          <a href="https://github.com/avipaul6" target="_blank" rel="noopener">GitHub</a>
          <a href="https://www.linkedin.com/in/avijitpaul/" target="_blank" rel="noopener">LinkedIn</a>
          <a href="mailto:me@avipaul.dev">Email</a>
        </div>
      </div>
    </footer>

  </div>
</body>
</html>
